[project]
name = "[project-name]"
revision = "1.0"

[profiles.default]
# Local controls: where and how `forge` commands operate. They are not app
# secrets; Fence Rider reads them to target the opt-in `forge:*` scripts.
# `providers` names a storage role, not a backend: each developer or CI
# operator binds `shared_config` to a backend in their own SecretSpec config.
# Use `project_config` instead if a target must not follow other projects.
FORGE_SITE = { description = "Forge site hostname, e.g. example.atlassian.net", required = true, providers = ["shared_config"] }
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira", providers = ["shared_config"] }
FORGE_ENVIRONMENT = { description = "Forge environment name (development, staging, production)", default = "development", providers = ["shared_config"] }

# Declare each app variable once in this profile, then list it in a scope:
#   [scopes.runtime]   uploaded encrypted by `npm run forge:variables:set`
#   [scopes.manifest]  must also be declared in manifest.yml
# Members of neither scope stay local. Never list FORGE_* controls in a scope.
#
# Route every value through an explicit storage role. Credentials use
# `project_secrets`; never fall back to a config role, and never define these
# aliases in a `[providers]` table here (that overrides user bindings).
# Other roles: `project_config`, `shared_secrets`. Scopes choose delivery to
# Forge, not storage or sensitivity.
#
# API_TOKEN = { description = "Runtime credential", required = true, providers = ["project_secrets"] }
#
# [scopes.runtime]
# secrets = ["API_TOKEN"]
