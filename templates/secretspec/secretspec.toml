[project]
name = "[project-name]"
revision = "1.0"

[profiles.default]
# CLI-targeting values: where and how `forge` commands operate. These are not
# app secrets, but SecretSpec is the disciplined, non-interactive way this
# repository supplies them to the opt-in `forge:*` scripts.
FORGE_SITE = { description = "Forge site hostname, e.g. example.atlassian.net", required = true }
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira" }
FORGE_ENVIRONMENT = { description = "Forge environment name (development, staging, production)", default = "development" }

# App-level runtime secrets are declared here and pushed to the deployed app via
# `npm run forge:variables:set`, which reads APP_VARIABLE_KEYS in
# scripts/forge-vars-from-secretspec.js. Add a key in both places when an
# external source needs a real credential, such as an API token.
