colors: false
output:
  - meta
  - summary
  - failure

lint:
  parallel: true
  commands:
    prelint:
      run: npm run lint:prelint --if-present
    biome:
      run: npm run lint:check --if-present
    fallow:
      run: npm run lint:fallow --if-present
    forge:
      run: npm run lint:forge --if-present
    typecheck:
      run: npm run typecheck --if-present
    format:
      run: npm run format:check --if-present

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: |
        command -v gitleaks >/dev/null 2>&1 || {
          echo "gitleaks not found on PATH. Install it with: brew install gitleaks" >&2
          exit 1
        }
        gitleaks git --pre-commit --staged
    format:
      run: npm run format --if-present
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: npm run lint --if-present
    test:
      run: npm run test --if-present
    size:
      run: npm run size:check --if-present
