colors: false
output:
  - meta
  - summary
  - failure

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: |
        command -v gitleaks >/dev/null 2>&1 || {
          echo "gitleaks not found on PATH. Install it with: brew install gitleaks" >&2
          exit 1
        }
        gitleaks git --pre-commit --staged
    format:
      run: npm run format --if-present
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: npm run lint --if-present
    test:
      run: npm run test --if-present
    size:
      run: npm run size:check --if-present
    pack:
      run: npm run pack:check --if-present
