# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.dagger-typescript-sdk]
source = "github.com/dagger/typescript-sdk"

[sdks.typescript]
module = "dagger-typescript-sdk"

[sdks.typescript.scopes."."]
is-module = true
name = "drop-calf"
